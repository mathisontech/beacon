<g><rect fill="#DDF3F0" stroke="#1F8A7A" x="428" y="78" width="172" height="60" rx="8" stroke-width="0.75"/><text font-size="14" font-weight="700" fill="#0B4F46" x="514" y="96" text-anchor="middle" dominant-baseline="central">Mitigation models</text><text font-size="12" font-weight="500" fill="#1F6E62" x="514" y="113" text-anchor="middle" dominant-baseline="central">what interventions and</text><text font-size="12" font-weight="500" fill="#1F6E62" x="514" y="128" text-anchor="middle" dominant-baseline="central">tech change the outcome</text></g>
