<g><rect fill="#E8F1FB" stroke="#2F6FB3" x="40" y="30" width="760" height="150" rx="20" stroke-width="0.75"/><text font-size="14" font-weight="700" fill="#0C447C" x="60" y="50" dominant-baseline="central">Hazard world model</text><text font-size="12" font-weight="500" fill="#0C447C" x="60" y="66" dominant-baseline="central">general: how hazards unfold and how we manage them · owns every model · knows no one person's context</text><text font-size="12" font-weight="500" fill="#0C447C" x="60" y="152" dominant-baseline="central">learned from: world history, real event records, model knowledge, mitigation activity,</text><text font-size="12" font-weight="500" fill="#0C447C" x="60" y="166" dominant-baseline="central">technology change, outside data sources, our own activity data</text></g>
<g><rect fill="#DDF3F0" stroke="#1F8A7A" x="60" y="78" width="172" height="60" rx="8" stroke-width="0.75"/><text font-size="14" font-weight="700" fill="#0B4F46" x="146" y="96" text-anchor="middle" dominant-baseline="central">Hazard models</text><text font-size="12" font-weight="500" fill="#1F6E62" x="146" y="113" text-anchor="middle" dominant-baseline="central">triggers, sequences,</text><text font-size="12" font-weight="500" fill="#1F6E62" x="146" y="128" text-anchor="middle" dominant-baseline="central">cascades, end signals</text></g>
