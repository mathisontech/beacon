<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="730" viewBox="0 0 1000 730" role="img" font-family="Manrope, 'Segoe UI', system-ui, sans-serif">
<title>Beacon domains and teams</title>
<rect width="1000" height="730" fill="#ffffff"/>
<defs><marker id="arrow3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#555" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<!-- parent -->
<g><rect fill="#F3F3F3" stroke="#8A8A8A" x="40" y="20" width="920" height="40" rx="8" stroke-width="0.75"/><text font-size="14" font-weight="700" fill="#222222" x="500" y="40" text-anchor="middle" dominant-baseline="central">Mathison Technologies · parent company</text></g>
<line stroke="#555" stroke-width="1.5" x1="500" y1="60" x2="500" y2="78" marker-end="url(#arrow3)"/>
<!-- strategy -->
<g><rect fill="#E8F1FB" stroke="#2F6FB3" x="40" y="80" width="920" height="118" rx="14" stroke-width="0.75"/><text font-size="14" font-weight="700" fill="#0C447C" x="60" y="100" dominant-baseline="central">Beacon strategy · c-suite level</text><text font-size="12" font-weight="500" fill="#0C447C" x="60" y="118" dominant-baseline="central">direction, budgets, people and agents, money, risk · the shared services live here and serve all four domains</text></g>
<g><rect fill="#E8F1FB" stroke="#2F6FB3" x="60" y="132" width="205" height="52" rx="8" stroke-width="0.75"/><text font-size="14" font-weight="700" fill="#0C447C" x="162" y="150" text-anchor="middle" dominant-baseline="central">C-suite</text><text font-size="12" font-weight="500" fill="#0C447C" x="162" y="168" text-anchor="middle" dominant-baseline="central">direction, priorities, the calls</text></g>
<g><rect fill="#E8F1FB" stroke="#2F6FB3" x="285" y="132" width="205" height="52" rx="8" stroke-width="0.75"/><text font-size="14" font-weight="700" fill="#0C447C" x="387" y="150" text-anchor="middle" dominant-baseline="central">HR and agentic ops</text><text font-size="12" font-weight="500" fill="#0C447C" x="387" y="168" text-anchor="middle" dominant-baseline="central">people, and the agent workforce</text></g>
<g><rect fill="#E8F1FB" stroke="#2F6FB3" x="510" y="132" width="205" height="52" rx="8" stroke-width="0.75"/><text font-size="14" font-weight="700" fill="#0C447C" x="612" y="150" text-anchor="middle" dominant-baseline="central">Finance and accounting</text><text font-size="12" font-weight="500" fill="#0C447C" x="612" y="168" text-anchor="middle" dominant-baseline="central">cost per domain, pricing, close</text></g>
<g><rect fill="#E8F1FB" stroke="#2F6FB3" x="735" y="132" width="205" height="52" rx="8" stroke-width="0.75"/><text font-size="14" font-weight="700" fill="#0C447C" x="837" y="150" text-anchor="middle" dominant-baseline="central">Legal and compliance</text><text font-size="12" font-weight="500" fill="#0C447C" x="837" y="168" text-anchor="middle" dominant-baseline="central">alert liability, data agreements</text></g>
<line stroke="#555" stroke-width="1.5" x1="500" y1="198" x2="500" y2="216" marker-end="url(#arrow3)"/>
<!-- domain 1: lakehouse -->
<g><rect fill="none" stroke="#8a8a8a" x="40" y="218" width="215" height="330" rx="14" stroke-width="0.75" stroke-dasharray="5 4"/><text font-size="14" font-weight="700" fill="#121212" x="54" y="238" dominant-baseline="central">Data lakehouse</text><text font-size="12" font-weight="500" fill="#7a7a7a" x="54" y="256" dominant-baseline="central">the data and the compute</text><text font-size="12" font-weight="500" fill="#7a7a7a" x="54" y="272" dominant-baseline="central">IT and cyber</text></g>
<g><rect fill="#F3F3F3" stroke="#8A8A8A" x="52" y="288" width="191" height="46" rx="8" stroke-width="0.75"/><text font-size="14" font-weight="700" fill="#222222" x="64" y="306" dominant-baseline="central">Data pipelines</text><text font-size="12" font-weight="500" fill="#555555" x="64" y="323" dominant-baseline="central">every feed in, with lineage</text></g>
<g><rect fill="#F3F3F3" stroke="#8A8A8A" x="52" y="342" width="191" height="46" rx="8" stroke-width="0.75"/><text font-size="14" font-weight="700" fill="#222222" x="64" y="360" dominant-baseline="central">Security</text><text font-size="12" font-weight="500" fill="#555555" x="64" y="377" dominant-baseline="central">perimeter, identity, audit</text></g>
<g><rect fill="#F3F3F3" stroke="#8A8A8A" x="52" y="396" width="191" height="46" rx="8" stroke-width="0.75"/><text font-size="14" font-weight="700" fill="#222222" x="64" y="414" dominant-baseline="central">Internal compute</text><text font-size="12" font-weight="500" fill="#555555" x="64" y="431" dominant-baseline="central">capacity, cost, scheduling</text></g>
<g><rect fill="#EEE8FA" stroke="#6C4BB8" x="52" y="458" width="191" height="76" rx="8" stroke-width="0.75"/><text font-size="12" font-weight="700" fill="#3A2478" x="64" y="474" dominant-baseline="central">Owns in the core</text><text font-size="12" font-weight="500" fill="#5B3FA0" x="64" y="491" dominant-baseline="central">sources and products, in</text><text font-size="12" font-weight="500" fill="#5B3FA0" x="64" y="506" dominant-baseline="central">state and cache storage</text><text font-size="12" font-weight="500" fill="#5B3FA0" x="64" y="521" dominant-baseline="central">compute for the dynamics</text></g>
<!-- domain 2: backend -->
<g><rect fill="none" stroke="#8a8a8a" x="275" y="218" width="215" height="330" rx="14" stroke-width="0.75" stroke-dasharray="5 4"/><text font-size="14" font-weight="700" fill="#121212" x="289" y="238" dominant-baseline="central">Backend development</text><text font-size="12" font-weight="500" fill="#7a7a7a" x="289" y="256" dominant-baseline="central">the model and the loop</text><text font-size="12" font-weight="500" fill="#7a7a7a" x="289" y="272" dominant-baseline="central">AI and data science</text></g>
<g><rect fill="#DDF3F0" stroke="#1F8A7A" x="287" y="288" width="191" height="73" rx="8" stroke-width="0.75"/><text font-size="14" font-weight="700" fill="#0B4F46" x="299" y="306" dominant-baseline="central">AI team</text><text font-size="12" font-weight="500" fill="#1F6E62" x="299" y="324" dominant-baseline="central">the world model, the engines,</text><text font-size="12" font-weight="500" fill="#1F6E62" x="299" y="340" dominant-baseline="central">the scenario template library</text></g>
<g><rect fill="#DDF3F0" stroke="#1F8A7A" x="287" y="369" width="191" height="73" rx="8" stroke-width="0.75"/><text font-size="14" font-weight="700" fill="#0B4F46" x="299" y="387" dominant-baseline="central">Data science team</text><text font-size="12" font-weight="500" fill="#1F6E62" x="299" y="405" dominant-baseline="central">calibration, replays, metrics,</text><text font-size="12" font-weight="500" fill="#1F6E62" x="299" y="421" dominant-baseline="central">expected versus realized</text></g>
<g><rect fill="#EEE8FA" stroke="#6C4BB8" x="287" y="458" width="191" height="76" rx="8" stroke-width="0.75"/><text font-size="12" font-weight="700" fill="#3A2478" x="299" y="474" dominant-baseline="central">Owns in the core</text><text font-size="12" font-weight="500" fill="#5B3FA0" x="299" y="491" dominant-baseline="central">world model and world state</text><text font-size="12" font-weight="500" fill="#5B3FA0" x="299" y="506" dominant-baseline="central">expected signals</text><text font-size="12" font-weight="500" fill="#5B3FA0" x="299" y="521" dominant-baseline="central">perception, inference, planning</text></g>
<!-- domain 3: product -->
<g><rect fill="none" stroke="#8a8a8a" x="510" y="218" width="215" height="330" rx="14" stroke-width="0.75" stroke-dasharray="5 4"/><text font-size="14" font-weight="700" fill="#121212" x="524" y="238" dominant-baseline="central">Product development</text><text font-size="12" font-weight="500" fill="#7a7a7a" x="524" y="256" dominant-baseline="central">the surfaces people use</text><text font-size="12" font-weight="500" fill="#7a7a7a" x="524" y="272" dominant-baseline="central">engineering, design, testing</text></g>
<g><rect fill="#E3F3E4" stroke="#2E8B45" x="522" y="288" width="191" height="46" rx="8" stroke-width="0.75"/><text font-size="14" font-weight="700" fill="#14512A" x="534" y="306" dominant-baseline="central">Software engineering</text><text font-size="12" font-weight="500" fill="#256E3A" x="534" y="323" dominant-baseline="central">the six products and the API</text></g>
<g><rect fill="#E3F3E4" stroke="#2E8B45" x="522" y="342" width="191" height="46" rx="8" stroke-width="0.75"/><text font-size="14" font-weight="700" fill="#14512A" x="534" y="360" dominant-baseline="central">UI research and design</text><text font-size="12" font-weight="500" fill="#256E3A" x="534" y="377" dominant-baseline="central">what people actually need</text></g>
<g><rect fill="#E3F3E4" stroke="#2E8B45" x="522" y="396" width="191" height="46" rx="8" stroke-width="0.75"/><text font-size="14" font-weight="700" fill="#14512A" x="534" y="414" dominant-baseline="central">Product testing</text><text font-size="12" font-weight="500" fill="#256E3A" x="534" y="431" dominant-baseline="central">replay suites, field tests</text></g>
<g><rect fill="#EEE8FA" stroke="#6C4BB8" x="522" y="458" width="191" height="76" rx="8" stroke-width="0.75"/><text font-size="12" font-weight="700" fill="#3A2478" x="534" y="474" dominant-baseline="central">Owns in the core</text><text font-size="12" font-weight="500" fill="#5B3FA0" x="534" y="491" dominant-baseline="central">the actor's surfaces</text><text font-size="12" font-weight="500" fill="#5B3FA0" x="534" y="506" dominant-baseline="central">app, ops bridge, review, API</text><text font-size="12" font-weight="500" fill="#5B3FA0" x="534" y="521" dominant-baseline="central">guidance cached to phones</text></g>
<!-- domain 4: deployed -->
<g><rect fill="none" stroke="#8a8a8a" x="745" y="218" width="215" height="330" rx="14" stroke-width="0.75" stroke-dasharray="5 4"/><text font-size="14" font-weight="700" fill="#121212" x="759" y="238" dominant-baseline="central">Deployed product</text><text font-size="12" font-weight="500" fill="#7a7a7a" x="759" y="256" dominant-baseline="central">the field</text><text font-size="12" font-weight="500" fill="#7a7a7a" x="759" y="272" dominant-baseline="central">sales, marketing, monitoring</text></g>
<g><rect fill="#FBE4E0" stroke="#C2502F" x="757" y="288" width="191" height="46" rx="8" stroke-width="0.75"/><text font-size="14" font-weight="700" fill="#6B2412" x="769" y="306" dominant-baseline="central">Sales and relationships</text><text font-size="12" font-weight="500" fill="#8A3A20" x="769" y="323" dominant-baseline="central">onboarding, service, liaisons</text></g>
<g><rect fill="#FBE4E0" stroke="#C2502F" x="757" y="342" width="191" height="46" rx="8" stroke-width="0.75"/><text font-size="14" font-weight="700" fill="#6B2412" x="769" y="360" dominant-baseline="central">Marketing and PR</text><text font-size="12" font-weight="500" fill="#8A3A20" x="769" y="377" dominant-baseline="central">the message, the record</text></g>
<g><rect fill="#FBE4E0" stroke="#C2502F" x="757" y="396" width="191" height="46" rx="8" stroke-width="0.75"/><text font-size="14" font-weight="700" fill="#6B2412" x="769" y="414" dominant-baseline="central">Monitoring and analytics</text><text font-size="12" font-weight="500" fill="#8A3A20" x="769" y="431" dominant-baseline="central">the field, watched 24/7</text></g>
<g><rect fill="#EEE8FA" stroke="#6C4BB8" x="757" y="458" width="191" height="76" rx="8" stroke-width="0.75"/><text font-size="12" font-weight="700" fill="#3A2478" x="769" y="474" dominant-baseline="central">Owns in the core</text><text font-size="12" font-weight="500" fill="#5B3FA0" x="769" y="491" dominant-baseline="central">signals back down, received</text><text font-size="12" font-weight="500" fill="#5B3FA0" x="769" y="506" dominant-baseline="central">bridges crossed, data back</text><text font-size="12" font-weight="500" fill="#5B3FA0" x="769" y="521" dominant-baseline="central">expected vs realized, live</text></g>
<!-- handoffs, left to right -->
<path stroke="#555" stroke-width="1.5" d="M168 548 V582 H362 V550" fill="none" marker-end="url(#arrow3)"/>
<path stroke="#555" stroke-width="1.5" d="M403 548 V582 H597 V550" fill="none" marker-end="url(#arrow3)"/>
<path stroke="#555" stroke-width="1.5" d="M638 548 V582 H832 V550" fill="none" marker-end="url(#arrow3)"/>
<g><text font-size="12" font-weight="500" fill="#7a7a7a" x="265" y="598" text-anchor="middle" dominant-baseline="central">data contracts</text><text font-size="12" font-weight="500" fill="#7a7a7a" x="500" y="598" text-anchor="middle" dominant-baseline="central">model services</text><text font-size="12" font-weight="500" fill="#7a7a7a" x="735" y="598" text-anchor="middle" dominant-baseline="central">releases and runbooks</text></g>
<!-- the return -->
<path stroke="#555" stroke-width="1.5" d="M873 548 V622 H127 V550" fill="none" marker-end="url(#arrow3)"/>
<g><text font-size="12" font-weight="500" fill="#7a7a7a" x="500" y="638" text-anchor="middle" dominant-baseline="central">telemetry and bridge data · what clients brought, what people reported, what actually happened · closes the loop</text></g>
<!-- thesis -->
<g><rect fill="#F3F3F3" stroke="#8A8A8A" x="40" y="660" width="920" height="56" rx="8" stroke-width="0.75"/><text font-size="14" font-weight="700" fill="#222222" x="500" y="680" text-anchor="middle" dominant-baseline="central">Read left to right, the four domains are the core diagram: data in, the model and the loop, the surfaces, the field.</text><text font-size="12" font-weight="500" fill="#555555" x="500" y="699" text-anchor="middle" dominant-baseline="central">The field pays data back into the lakehouse. That return arrow is the product. Every domain's job is to make it wider.</text></g>
</svg>
