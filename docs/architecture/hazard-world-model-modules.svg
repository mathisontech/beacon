<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="902" viewBox="0 0 1000 902" role="img" font-family="Manrope, 'Segoe UI', system-ui, sans-serif">
<title>Building the unified model: the modules that go into it</title>
<rect width="1000" height="902" fill="#ffffff"/>
<defs><marker id="arrow8" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#555" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g><path fill="#F3F3F3" stroke="#8A8A8A" d="M40 37 a100.0 7 0 0 0 200 0 v62 a100.0 7 0 0 1 -200 0 z" stroke-width="0.75"/><ellipse fill="#F3F3F3" stroke="#8A8A8A" cx="140" cy="37" rx="100.0" ry="7" stroke-width="0.75"/><text font-size="14" font-weight="700" fill="#222222" x="140" y="56" text-anchor="middle" dominant-baseline="central">Knowledge base</text><text font-size="12" font-weight="500" fill="#555555" x="140" y="73" text-anchor="middle" dominant-baseline="central">history, event records,</text><text font-size="12" font-weight="500" fill="#555555" x="140" y="88" text-anchor="middle" dominant-baseline="central">model literature, our activity</text></g>
<g><rect fill="#DDF3F0" stroke="#1F8A7A" x="262" y="30" width="204" height="76" rx="8" stroke-width="0.75"/><text font-size="14" font-weight="700" fill="#0B4F46" x="364" y="48" text-anchor="middle" dominant-baseline="central">Model research</text><text font-size="12" font-weight="500" fill="#1F6E62" x="364" y="65" text-anchor="middle" dominant-baseline="central">the models that exist today;</text><text font-size="12" font-weight="500" fill="#1F6E62" x="364" y="80" text-anchor="middle" dominant-baseline="central">which fills which gap, how well</text></g>
<g><rect fill="#DDF3F0" stroke="#1F8A7A" x="488" y="30" width="236" height="76" rx="8" stroke-width="0.75"/><text font-size="14" font-weight="700" fill="#0B4F46" x="606" y="48" text-anchor="middle" dominant-baseline="central">Training and calibration</text><text font-size="12" font-weight="500" fill="#1F6E62" x="606" y="65" text-anchor="middle" dominant-baseline="central">fit each model on real events</text><text font-size="12" font-weight="500" fill="#1F6E62" x="606" y="80" text-anchor="middle" dominant-baseline="central">and replays; expected vs realized</text></g>
<g><path fill="#DDF3F0" stroke="#1F8A7A" d="M746 37 a107.0 7 0 0 0 214 0 v62 a107.0 7 0 0 1 -214 0 z" stroke-width="0.75"/><ellipse fill="#DDF3F0" stroke="#1F8A7A" cx="853" cy="37" rx="107.0" ry="7" stroke-width="0.75"/><text font-size="14" font-weight="700" fill="#0B4F46" x="853" y="56" text-anchor="middle" dominant-baseline="central">Model registry</text><text font-size="12" font-weight="500" fill="#1F6E62" x="853" y="73" text-anchor="middle" dominant-baseline="central">pinned versions with scorecards;</text><text font-size="12" font-weight="500" fill="#1F6E62" x="853" y="88" text-anchor="middle" dominant-baseline="central">nothing runs unpinned</text></g>
<path stroke="#555" stroke-width="1.5" d="M240 68 H260" fill="none" marker-end="url(#arrow8)"/>
<path stroke="#555" stroke-width="1.5" d="M466 68 H486" fill="none" marker-end="url(#arrow8)"/>
<path stroke="#555" stroke-width="1.5" d="M724 68 H744" fill="none" marker-end="url(#arrow8)"/>
<path stroke="#555" stroke-width="1.5" d="M853 106 V138" fill="none" marker-end="url(#arrow8)"/>
<g><text font-size="12" font-weight="500" fill="#7a7a7a" x="866" y="122" text-anchor="start" dominant-baseline="central">pinned versions</text></g>
<g><rect fill="#E8F1FB" stroke="#2F6FB3" x="40" y="140" width="920" height="262" rx="20" stroke-width="0.75"/><text font-size="14" font-weight="700" fill="#0C447C" x="60" y="160" dominant-baseline="central">Hazard world model</text><text font-size="12" font-weight="500" fill="#0C447C" x="820" y="160" text-anchor="end" dominant-baseline="central">general · owns every model · knows no one person</text></g>
<g><rect fill="#DDF3F0" stroke="#1F8A7A" x="58" y="178" width="215" height="44" rx="8" stroke-width="0.75"/><text font-size="14" font-weight="700" fill="#0B4F46" x="165" y="194" text-anchor="middle" dominant-baseline="central">Hazard models</text><text font-size="12" font-weight="500" fill="#1F6E62" x="165" y="211" text-anchor="middle" dominant-baseline="central">triggers, cascades, end signals</text></g>
<g><rect fill="#DDF3F0" stroke="#1F8A7A" x="58" y="232" width="215" height="74" rx="8" stroke-width="0.75"/><text font-size="14" font-weight="700" fill="#0B4F46" x="165" y="249" text-anchor="middle" dominant-baseline="central">Condition models</text><text font-size="12" font-weight="500" fill="#1F6E62" x="165" y="266" text-anchor="middle" dominant-baseline="central">rain, river level, soil moisture,</text><text font-size="12" font-weight="500" fill="#1F6E62" x="165" y="280" text-anchor="middle" dominant-baseline="central">wind, ground motion, fire weather</text><text font-size="12" font-weight="500" fill="#1F6E62" x="165" y="294" text-anchor="middle" dominant-baseline="central">fills where no gauge reports</text></g>
<g><rect fill="#DDF3F0" stroke="#1F8A7A" x="58" y="314" width="215" height="74" rx="8" stroke-width="0.75"/><text font-size="14" font-weight="700" fill="#0B4F46" x="165" y="331" text-anchor="middle" dominant-baseline="central">Event models</text><text font-size="12" font-weight="500" fill="#1F6E62" x="165" y="348" text-anchor="middle" dominant-baseline="central">one per hazard: triggers,</text><text font-size="12" font-weight="500" fill="#1F6E62" x="165" y="362" text-anchor="middle" dominant-baseline="central">sequence, cascades, end signals</text><text font-size="12" font-weight="500" fill="#1F6E62" x="165" y="376" text-anchor="middle" dominant-baseline="central">the footprint over time</text></g>
<g><rect fill="#DDF3F0" stroke="#1F8A7A" x="281" y="178" width="215" height="44" rx="8" stroke-width="0.75"/><text font-size="14" font-weight="700" fill="#0B4F46" x="388" y="194" text-anchor="middle" dominant-baseline="central">Impact models</text><text font-size="12" font-weight="500" fill="#1F6E62" x="388" y="211" text-anchor="middle" dominant-baseline="central">force out, force taken</text></g>
<g><rect fill="#DDF3F0" stroke="#1F8A7A" x="281" y="232" width="215" height="74" rx="8" stroke-width="0.75"/><text font-size="14" font-weight="700" fill="#0B4F46" x="388" y="249" text-anchor="middle" dominant-baseline="central">Object state models</text><text font-size="12" font-weight="500" fill="#1F6E62" x="388" y="266" text-anchor="middle" dominant-baseline="central">force given off vs force taken</text><text font-size="12" font-weight="500" fill="#1F6E62" x="388" y="280" text-anchor="middle" dominant-baseline="central">intact, damaged, cut off</text><text font-size="12" font-weight="500" fill="#1F6E62" x="388" y="294" text-anchor="middle" dominant-baseline="central">fragility by construction type</text></g>
<g><rect fill="#DDF3F0" stroke="#1F8A7A" x="281" y="314" width="215" height="74" rx="8" stroke-width="0.75"/><text font-size="14" font-weight="700" fill="#0B4F46" x="388" y="331" text-anchor="middle" dominant-baseline="central">People state models</text><text font-size="12" font-weight="500" fill="#1F6E62" x="388" y="348" text-anchor="middle" dominant-baseline="central">where everyone is, last seen,</text><text font-size="12" font-weight="500" fill="#1F6E62" x="388" y="362" text-anchor="middle" dominant-baseline="central">needs help or can help</text><text font-size="12" font-weight="500" fill="#1F6E62" x="388" y="376" text-anchor="middle" dominant-baseline="central">population and movement priors</text></g>
<g><rect fill="#DDF3F0" stroke="#1F8A7A" x="504" y="178" width="215" height="44" rx="8" stroke-width="0.75"/><text font-size="14" font-weight="700" fill="#0B4F46" x="611" y="194" text-anchor="middle" dominant-baseline="central">Mitigation models</text><text font-size="12" font-weight="500" fill="#1F6E62" x="611" y="211" text-anchor="middle" dominant-baseline="central">what changes the outcome</text></g>
<g><rect fill="#DDF3F0" stroke="#1F8A7A" x="504" y="232" width="215" height="74" rx="8" stroke-width="0.75"/><text font-size="14" font-weight="700" fill="#0B4F46" x="611" y="249" text-anchor="middle" dominant-baseline="central">Evacuation and routes</text><text font-size="12" font-weight="500" fill="#1F6E62" x="611" y="266" text-anchor="middle" dominant-baseline="central">which routes pass, in time?</text><text font-size="12" font-weight="500" fill="#1F6E62" x="611" y="280" text-anchor="middle" dominant-baseline="central">a route someone got through,</text><text font-size="12" font-weight="500" fill="#1F6E62" x="611" y="294" text-anchor="middle" dominant-baseline="central">traced and shared behind them</text></g>
<g><rect fill="#DDF3F0" stroke="#1F8A7A" x="504" y="314" width="215" height="74" rx="8" stroke-width="0.75"/><text font-size="14" font-weight="700" fill="#0B4F46" x="611" y="331" text-anchor="middle" dominant-baseline="central">Mitigation and management</text><text font-size="12" font-weight="500" fill="#1F6E62" x="611" y="348" text-anchor="middle" dominant-baseline="central">resources, what each pump,</text><text font-size="12" font-weight="500" fill="#1F6E62" x="611" y="362" text-anchor="middle" dominant-baseline="central">truck, helicopter can do,</text><text font-size="12" font-weight="500" fill="#1F6E62" x="611" y="376" text-anchor="middle" dominant-baseline="central">who to send, where to stage</text></g>
<g><rect fill="#DDF3F0" stroke="#1F8A7A" x="727" y="178" width="215" height="44" rx="8" stroke-width="0.75"/><text font-size="14" font-weight="700" fill="#0B4F46" x="834" y="194" text-anchor="middle" dominant-baseline="central">Observation model</text><text font-size="12" font-weight="500" fill="#1F6E62" x="834" y="211" text-anchor="middle" dominant-baseline="central">what a sensor sees</text></g>
<g><rect fill="#DDF3F0" stroke="#1F8A7A" x="727" y="232" width="215" height="74" rx="8" stroke-width="0.75"/><text font-size="14" font-weight="700" fill="#0B4F46" x="834" y="249" text-anchor="middle" dominant-baseline="central">Sensor renderers</text><text font-size="12" font-weight="500" fill="#1F6E62" x="834" y="266" text-anchor="middle" dominant-baseline="central">how each state looks to a</text><text font-size="12" font-weight="500" fill="#1F6E62" x="834" y="280" text-anchor="middle" dominant-baseline="central">satellite pass, gauge, radar,</text><text font-size="12" font-weight="500" fill="#1F6E62" x="834" y="294" text-anchor="middle" dominant-baseline="central">seismometer, camera</text></g>
<g><rect fill="#DDF3F0" stroke="#1F8A7A" x="727" y="314" width="215" height="74" rx="8" stroke-width="0.75"/><text font-size="14" font-weight="700" fill="#0B4F46" x="834" y="331" text-anchor="middle" dominant-baseline="central">People as sensors</text><text font-size="12" font-weight="500" fill="#1F6E62" x="834" y="348" text-anchor="middle" dominant-baseline="central">what a phone photo, check-in,</text><text font-size="12" font-weight="500" fill="#1F6E62" x="834" y="362" text-anchor="middle" dominant-baseline="central">or report from a spot shows;</text><text font-size="12" font-weight="500" fill="#1F6E62" x="834" y="376" text-anchor="middle" dominant-baseline="central">absence is a signal too</text></g>
<path stroke="#555" stroke-width="1.5" d="M500 402 V420" fill="none" marker-end="url(#arrow8)"/>
<g><rect fill="#E3F3E4" stroke="#2E8B45" x="330" y="422" width="340" height="56" rx="8" stroke-width="0.75"/><text font-size="14" font-weight="700" fill="#14512A" x="500" y="439" text-anchor="middle" dominant-baseline="central">Simulation engine</text><text font-size="12" font-weight="500" fill="#256E3A" x="500" y="456" text-anchor="middle" dominant-baseline="central">the world model applied: every model coupled,</text><text font-size="12" font-weight="500" fill="#256E3A" x="500" y="471" text-anchor="middle" dominant-baseline="central">forward, what-if, replay, ensembles</text></g>
<path stroke="#555" stroke-width="1.5" d="M500 478 V508" fill="none" marker-end="url(#arrow8)"/>
<g><rect fill="#FBF0D6" stroke="#B7791F" x="40" y="510" width="230" height="56" rx="8" stroke-width="0.75"/><text font-size="14" font-weight="700" fill="#6B4308" x="155" y="528" text-anchor="middle" dominant-baseline="central">Expected signals</text><text font-size="12" font-weight="500" fill="#8C5A12" x="155" y="545" text-anchor="middle" dominant-baseline="central">by place, time, sensor · cached</text></g>
<g><rect fill="#EEE8FA" stroke="#6C4BB8" x="330" y="510" width="340" height="56" rx="8" stroke-width="0.75"/><text font-size="14" font-weight="700" fill="#3A2478" x="500" y="528" text-anchor="middle" dominant-baseline="central">World state · the unified model</text><text font-size="12" font-weight="500" fill="#5B3FA0" x="500" y="545" text-anchor="middle" dominant-baseline="central">this place, these people, now · was, is, will, could</text></g>
<g><rect fill="#EEE8FA" stroke="#6C4BB8" x="700" y="510" width="260" height="56" rx="8" stroke-width="0.75"/><text font-size="14" font-weight="700" fill="#3A2478" x="830" y="528" text-anchor="middle" dominant-baseline="central">Place priors</text><text font-size="12" font-weight="500" fill="#5B3FA0" x="830" y="545" text-anchor="middle" dominant-baseline="central">terrain, buildings, roads, people</text></g>
<path stroke="#555" stroke-width="1.5" d="M330 538 H272" fill="none" marker-end="url(#arrow8)"/>
<g><text font-size="12" font-weight="500" fill="#7a7a7a" x="300" y="526" text-anchor="middle" dominant-baseline="central">renders</text></g>
<path stroke="#555" stroke-width="1.5" d="M700 538 H672" fill="none" marker-end="url(#arrow8)"/>
<g><rect fill="#F3F3F3" stroke="#8A8A8A" x="330" y="610" width="340" height="60" rx="8" stroke-width="0.75"/><text font-size="14" font-weight="700" fill="#222222" x="500" y="627" text-anchor="middle" dominant-baseline="central">Event data aggregator</text><text font-size="12" font-weight="500" fill="#555555" x="500" y="644" text-anchor="middle" dominant-baseline="central">one record per event, every minute:</text><text font-size="12" font-weight="500" fill="#555555" x="500" y="659" text-anchor="middle" dominant-baseline="central">what was seen, what was done</text></g>
<path stroke="#555" stroke-width="1.5" d="M500 610 V568" fill="none" marker-end="url(#arrow8)"/>
<g><text font-size="12" font-weight="500" fill="#7a7a7a" x="514" y="588" text-anchor="start" dominant-baseline="central">current signals</text></g>
<g><rect fill="#F3F3F3" stroke="#8A8A8A" x="700" y="610" width="260" height="60" rx="8" stroke-width="0.75"/><text font-size="14" font-weight="700" fill="#222222" x="830" y="627" text-anchor="middle" dominant-baseline="central">Base map and object registry</text><text font-size="12" font-weight="500" fill="#555555" x="830" y="644" text-anchor="middle" dominant-baseline="central">terrain, buildings, roads, bridges,</text><text font-size="12" font-weight="500" fill="#555555" x="830" y="659" text-anchor="middle" dominant-baseline="central">utilities, shelters, people</text></g>
<path stroke="#555" stroke-width="1.5" d="M830 610 V568" fill="none" marker-end="url(#arrow8)"/>
<g><text font-size="12" font-weight="500" fill="#7a7a7a" x="844" y="588" text-anchor="start" dominant-baseline="central">what is here</text></g>
<g><rect fill="#F3F3F3" stroke="#8A8A8A" x="40" y="710" width="210" height="60" rx="8" stroke-width="0.75"/><text font-size="14" font-weight="700" fill="#222222" x="145" y="727" text-anchor="middle" dominant-baseline="central">Sources</text><text font-size="12" font-weight="500" fill="#555555" x="145" y="744" text-anchor="middle" dominant-baseline="central">satellites, gauges, radar,</text><text font-size="12" font-weight="500" fill="#555555" x="145" y="759" text-anchor="middle" dominant-baseline="central">seismometers, phones, our apps</text></g>
<g><rect fill="#F3F3F3" stroke="#8A8A8A" x="270" y="710" width="230" height="60" rx="8" stroke-width="0.75"/><text font-size="14" font-weight="700" fill="#222222" x="385" y="727" text-anchor="middle" dominant-baseline="central">Data ingestion manager</text><text font-size="12" font-weight="500" fill="#555555" x="385" y="744" text-anchor="middle" dominant-baseline="central">connectors, contracts, a coverage</text><text font-size="12" font-weight="500" fill="#555555" x="385" y="759" text-anchor="middle" dominant-baseline="central">map of what covers where</text></g>
<g><rect fill="#F3F3F3" stroke="#8A8A8A" x="520" y="710" width="210" height="60" rx="8" stroke-width="0.75"/><text font-size="14" font-weight="700" fill="#222222" x="625" y="727" text-anchor="middle" dominant-baseline="central">Signal extractors</text><text font-size="12" font-weight="500" fill="#555555" x="625" y="744" text-anchor="middle" dominant-baseline="central">CV on photos, seismic solvers,</text><text font-size="12" font-weight="500" fill="#555555" x="625" y="759" text-anchor="middle" dominant-baseline="central">gauge parsers, map legends</text></g>
<path stroke="#555" stroke-width="1.5" d="M250 740 H268" fill="none" marker-end="url(#arrow8)"/>
<path stroke="#555" stroke-width="1.5" d="M500 740 H518" fill="none" marker-end="url(#arrow8)"/>
<path stroke="#555" stroke-width="1.5" d="M600 710 V672" fill="none" marker-end="url(#arrow8)"/>
<g><text font-size="12" font-weight="500" fill="#7a7a7a" x="586" y="691" text-anchor="end" dominant-baseline="central">signals</text></g>
<path stroke="#555" stroke-width="1.5" d="M715 710 V672" fill="none" marker-end="url(#arrow8)"/>
<g><text font-size="12" font-weight="500" fill="#7a7a7a" x="729" y="691" text-anchor="start" dominant-baseline="central">objects</text></g>
<path stroke="#555" stroke-width="1.5" d="M330 650 H22 V68 H38" fill="none" marker-end="url(#arrow8)"/>
<g><text font-size="12" font-weight="500" fill="#7a7a7a" x="12" y="400" text-anchor="middle" dominant-baseline="central" transform="rotate(-90 12 400)">event records and our own activity, back into the knowledge base</text></g>
<g><rect fill="#F3F3F3" stroke="#8A8A8A" x="40" y="800" width="920" height="72" rx="8" stroke-width="0.75"/><text font-size="14" font-weight="700" fill="#222222" x="500" y="820" text-anchor="middle" dominant-baseline="central">Two kinds of module build one model.</text><text font-size="12" font-weight="500" fill="#555555" x="500" y="839" text-anchor="middle" dominant-baseline="central">Data modules supply what is seen. Model modules supply what to expect where nothing is seen.</text><text font-size="12" font-weight="500" fill="#555555" x="500" y="855" text-anchor="middle" dominant-baseline="central">The world state is where they meet: the unified model. The next chart shows it running.</text></g>
</svg>
