<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="590" font-family="Manrope, 'Segoe UI', system-ui, sans-serif" viewBox="0 0 1000 590" role="img" aria-labelledby="pt pd"><title id="pt">How the product lines use the hazard world model</title><desc id="pd">Six product uses in three phases. Before: household hardening and town, city, business hardening query the could axis. During: the emergency operations bridge and the public and family app query the is and will axes. After: after-action review and research and API query the was axis. All connect through the world state to the core loop, and every product is a data bridge that pulls a view out and pushes signals back in.</desc>
<rect width="1000" height="590" fill="#ffffff"/><defs><marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#555" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<!-- Before -->
<g><rect fill="#FFFFFF" stroke="#8A8A8A" x="40" y="30" width="300" height="262" rx="14" stroke-width="0.75" stroke-dasharray="5 4"/><text font-size="14" font-weight="700" fill="#222222" x="60" y="50" dominant-baseline="central">Before</text><text font-size="12" fill="#666666" x="60" y="68" dominant-baseline="central">hazard hardening · the could axis</text></g>
<g><rect fill="#FBF0D6" stroke="#B7791F" x="52" y="86" width="276" height="92" rx="8" stroke-width="0.75"/><text font-size="14" font-weight="700" fill="#6B4308" x="64" y="104" dominant-baseline="central">Household hardening</text><text font-size="12" fill="#8C5A12" x="64" y="126" dominant-baseline="central">Which upgrades change my home's outcome?</text><text font-size="12" fill="#8C5A12" x="64" y="142" dominant-baseline="central">High-resolution runs on one parcel</text><text font-size="12" font-weight="700" fill="#6B4308" x="64" y="162" dominant-baseline="central">brings: parcel, construction, sensors</text></g>
<g><rect fill="#FBF0D6" stroke="#B7791F" x="52" y="190" width="276" height="92" rx="8" stroke-width="0.75"/><text font-size="14" font-weight="700" fill="#6B4308" x="64" y="208" dominant-baseline="central">Town, city, business hardening</text><text font-size="12" fill="#8C5A12" x="64" y="230" dominant-baseline="central">Which shared fixes save the most, where?</text><text font-size="12" fill="#8C5A12" x="64" y="246" dominant-baseline="central">Burn-together and flood-together zones</text><text font-size="12" font-weight="700" fill="#6B4308" x="64" y="266" dominant-baseline="central">brings: inventories, plans, budgets</text></g>
<!-- During -->
<g><rect fill="#FFFFFF" stroke="#8A8A8A" x="355" y="30" width="300" height="262" rx="14" stroke-width="0.75" stroke-dasharray="5 4"/><text font-size="14" font-weight="700" fill="#222222" x="375" y="50" dominant-baseline="central">During</text><text font-size="12" fill="#666666" x="375" y="68" dominant-baseline="central">the information bridge · the is and will axes</text></g>
<g><rect fill="#FBE4E0" stroke="#C2502F" x="367" y="86" width="276" height="92" rx="8" stroke-width="0.75"/><text font-size="14" font-weight="700" fill="#6B2412" x="379" y="104" dominant-baseline="central">Emergency operations bridge</text><text font-size="12" fill="#8A3A20" x="379" y="126" dominant-baseline="central">Which roads pass? Where are units needed?</text><text font-size="12" fill="#8A3A20" x="379" y="142" dominant-baseline="central">Who is helped already, who needs pros?</text><text font-size="12" font-weight="700" fill="#6B2412" x="379" y="162" dominant-baseline="central">brings: unit positions, dispatch, tasking</text></g>
<g><rect fill="#FBE4E0" stroke="#C2502F" x="367" y="190" width="276" height="92" rx="8" stroke-width="0.75"/><text font-size="14" font-weight="700" fill="#6B2412" x="379" y="208" dominant-baseline="central">Public and family app</text><text font-size="12" fill="#8A3A20" x="379" y="230" dominant-baseline="central">What do I do now? Where are my people?</text><text font-size="12" fill="#8A3A20" x="379" y="246" dominant-baseline="central">Guidance cached before towers fall</text><text font-size="12" font-weight="700" fill="#6B2412" x="379" y="266" dominant-baseline="central">brings: photos, location, need or can help</text></g>
<!-- After -->
<g><rect fill="#FFFFFF" stroke="#8A8A8A" x="670" y="30" width="300" height="262" rx="14" stroke-width="0.75" stroke-dasharray="5 4"/><text font-size="14" font-weight="700" fill="#222222" x="690" y="50" dominant-baseline="central">After</text><text font-size="12" fill="#666666" x="690" y="68" dominant-baseline="central">review and research · the was axis</text></g>
<g><rect fill="#DDF3F0" stroke="#1F8A7A" x="682" y="86" width="276" height="92" rx="8" stroke-width="0.75"/><text font-size="14" font-weight="700" fill="#0B4F46" x="694" y="104" dominant-baseline="central">After-action review</text><text font-size="12" fill="#1F6E62" x="694" y="126" dominant-baseline="central">What would the full picture have changed?</text><text font-size="12" fill="#1F6E62" x="694" y="142" dominant-baseline="central">Replay what each team saw, by the minute</text><text font-size="12" font-weight="700" fill="#0B4F46" x="694" y="162" dominant-baseline="central">brings: logs, radio, timelines</text></g>
<g><rect fill="#DDF3F0" stroke="#1F8A7A" x="682" y="190" width="276" height="92" rx="8" stroke-width="0.75"/><text font-size="14" font-weight="700" fill="#0B4F46" x="694" y="208" dominant-baseline="central">Research and API</text><text font-size="12" fill="#1F6E62" x="694" y="230" dominant-baseline="central">The world state and its replays as data</text><text font-size="12" fill="#1F6E62" x="694" y="246" dominant-baseline="central">Validate and improve the models</text><text font-size="12" font-weight="700" fill="#0B4F46" x="694" y="266" dominant-baseline="central">brings: new models, verified datasets</text></g>
<!-- bridges: view out, signals in -->
<line stroke="#555" stroke-width="1.5" x1="190" y1="292" x2="190" y2="318" marker-start="url(#arrow2)" marker-end="url(#arrow2)"/>
<line stroke="#555" stroke-width="1.5" x1="505" y1="292" x2="505" y2="318" marker-start="url(#arrow2)" marker-end="url(#arrow2)"/>
<line stroke="#555" stroke-width="1.5" x1="820" y1="292" x2="820" y2="318" marker-start="url(#arrow2)" marker-end="url(#arrow2)"/>
<!-- world state bar -->
<g><rect fill="#EEE8FA" stroke="#6C4BB8" x="40" y="320" width="300" height="50" rx="8" stroke-width="0.75"/><text font-size="14" font-weight="700" fill="#3A2478" x="190" y="338" text-anchor="middle" dominant-baseline="central">World state · could</text><text font-size="12" fill="#5B3FA0" x="190" y="356" text-anchor="middle" dominant-baseline="central">what-if scenarios, one parcel to one region</text></g>
<g><rect fill="#EEE8FA" stroke="#6C4BB8" x="355" y="320" width="300" height="50" rx="8" stroke-width="0.75"/><text font-size="14" font-weight="700" fill="#3A2478" x="505" y="338" text-anchor="middle" dominant-baseline="central">World state · is and will</text><text font-size="12" fill="#5B3FA0" x="505" y="356" text-anchor="middle" dominant-baseline="central">the live picture and what comes next</text></g>
<g><rect fill="#EEE8FA" stroke="#6C4BB8" x="670" y="320" width="300" height="50" rx="8" stroke-width="0.75"/><text font-size="14" font-weight="700" fill="#3A2478" x="820" y="338" text-anchor="middle" dominant-baseline="central">World state · was</text><text font-size="12" fill="#5B3FA0" x="820" y="356" text-anchor="middle" dominant-baseline="central">replay, with each team's picture beside it</text></g>
<!-- state <-> core -->
<line stroke="#555" stroke-width="1.5" x1="505" y1="370" x2="505" y2="402" marker-start="url(#arrow2)" marker-end="url(#arrow2)"/>
<!-- the core loop -->
<g><rect fill="#E8F1FB" stroke="#2F6FB3" x="40" y="404" width="270" height="56" rx="8" stroke-width="0.75"/><text font-size="14" font-weight="700" fill="#0C447C" x="175" y="422" text-anchor="middle" dominant-baseline="central">Hazard world model</text><text font-size="12" fill="#2F5F92" x="175" y="440" text-anchor="middle" dominant-baseline="central">dynamics · observation · priors</text></g>
<g><rect fill="#E3F3E4" stroke="#2E8B45" x="340" y="404" width="140" height="56" rx="8" stroke-width="0.75"/><text font-size="14" font-weight="700" fill="#14512A" x="410" y="422" text-anchor="middle" dominant-baseline="central">Perception</text><text font-size="12" fill="#256E3A" x="410" y="440" text-anchor="middle" dominant-baseline="central">expected vs seen</text></g>
<g><rect fill="#E3F3E4" stroke="#2E8B45" x="500" y="404" width="140" height="56" rx="8" stroke-width="0.75"/><text font-size="14" font-weight="700" fill="#14512A" x="570" y="422" text-anchor="middle" dominant-baseline="central">Inference</text><text font-size="12" fill="#256E3A" x="570" y="440" text-anchor="middle" dominant-baseline="central">reweight scenarios</text></g>
<g><rect fill="#E3F3E4" stroke="#2E8B45" x="660" y="404" width="140" height="56" rx="8" stroke-width="0.75"/><text font-size="14" font-weight="700" fill="#14512A" x="730" y="422" text-anchor="middle" dominant-baseline="central">Planning</text><text font-size="12" fill="#256E3A" x="730" y="440" text-anchor="middle" dominant-baseline="central">options and plan</text></g>
<g><rect fill="#E3F3E4" stroke="#2E8B45" x="820" y="404" width="150" height="56" rx="8" stroke-width="0.75"/><text font-size="14" font-weight="700" fill="#14512A" x="895" y="422" text-anchor="middle" dominant-baseline="central">Actor</text><text font-size="12" fill="#256E3A" x="895" y="440" text-anchor="middle" dominant-baseline="central">alerts and tasking</text></g>
<line stroke="#555" stroke-width="1.5" x1="310" y1="432" x2="338" y2="432" marker-end="url(#arrow2)"/>
<line stroke="#555" stroke-width="1.5" x1="480" y1="432" x2="498" y2="432" marker-end="url(#arrow2)"/>
<line stroke="#555" stroke-width="1.5" x1="640" y1="432" x2="658" y2="432" marker-end="url(#arrow2)"/>
<line stroke="#555" stroke-width="1.5" x1="800" y1="432" x2="818" y2="432" marker-end="url(#arrow2)"/>
<!-- the bridge thesis -->
<g><rect fill="#F3F3F3" stroke="#8A8A8A" x="40" y="490" width="930" height="72" rx="8" stroke-width="0.75"/><text font-size="14" font-weight="700" fill="#222222" x="505" y="510" text-anchor="middle" dominant-baseline="central">Every product is a data bridge: it pulls a view out of the picture and pushes signals back in.</text><text font-size="12" fill="#555555" x="505" y="530" text-anchor="middle" dominant-baseline="central">Bridges compound. What the public reports during feeds the operations picture. Operations logs feed the review.</text><text font-size="12" fill="#555555" x="505" y="546" text-anchor="middle" dominant-baseline="central">Review findings feed hardening priors. Hardened homes and towns change how the next event unfolds.</text></g>
</svg>
