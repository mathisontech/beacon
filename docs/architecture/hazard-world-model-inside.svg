<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="916" viewBox="0 0 1000 916" role="img" font-family="Manrope, 'Segoe UI', system-ui, sans-serif">
<title>Inside the hazard world model: the how-do-we-know engine</title>
<rect width="1000" height="916" fill="#ffffff"/>
<defs><marker id="arrow7" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#555" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g><rect fill="#EEE8FA" stroke="#6C4BB8" x="190" y="30" width="630" height="50" rx="8" stroke-width="0.75"/><text font-size="14" font-weight="700" fill="#3A2478" x="505" y="48" text-anchor="middle" dominant-baseline="central">World state</text><text font-size="12" font-weight="500" fill="#5B3FA0" x="505" y="65" text-anchor="middle" dominant-baseline="central">the whole stack, applied to one place, these people, now</text></g>
<path stroke="#555" stroke-width="1.5" d="M500 110 V82" fill="none" marker-end="url(#arrow7)"/>
<g><text font-size="12" font-weight="500" fill="#7a7a7a" x="514" y="96" text-anchor="start" dominant-baseline="central">the answer, every minute</text></g>
<g><rect fill="#DDF3F0" stroke="#1F8A7A" x="190" y="110" width="630" height="58" rx="8" stroke-width="0.75"/><text font-size="14" font-weight="700" fill="#0B4F46" x="202" y="125" text-anchor="start" dominant-baseline="central">What goes where, and what changes the outcome?</text><text font-size="12" font-weight="700" fill="#0B4F46" x="808" y="125" text-anchor="end" dominant-baseline="central" letter-spacing="1">MITIGATION</text><text font-size="12" font-weight="500" fill="#1F6E62" x="202" y="142" text-anchor="start" dominant-baseline="central">Mitigation and management models · resources, equipment capabilities, who to send, where to stage</text><text font-size="12" font-weight="500" fill="#1F6E62" x="202" y="157" text-anchor="start" dominant-baseline="central" opacity="0.8">from: unit positions, inventories, what was done before · fills: a capability model per equipment</text></g>
<path stroke="#555" stroke-width="1.5" d="M170 139 H188" fill="none" marker-end="url(#arrow7)"/>
<path stroke="#555" stroke-width="1.5" d="M830 139 H822" fill="none" marker-end="url(#arrow7)"/>
<g><rect fill="#DDF3F0" stroke="#1F8A7A" x="190" y="186" width="630" height="58" rx="8" stroke-width="0.75"/><text font-size="14" font-weight="700" fill="#0B4F46" x="202" y="201" text-anchor="start" dominant-baseline="central">Which way out, and can they make it in time?</text><text font-size="12" font-weight="700" fill="#0B4F46" x="808" y="201" text-anchor="end" dominant-baseline="central" letter-spacing="1">MITIGATION</text><text font-size="12" font-weight="500" fill="#1F6E62" x="202" y="218" text-anchor="start" dominant-baseline="central">Evacuation and route models · which routes pass given object states and footprint; time to shelter</text><text font-size="12" font-weight="500" fill="#1F6E62" x="202" y="233" text-anchor="start" dominant-baseline="central" opacity="0.8">from: traffic, check-ins, routes people got through, then shared · fills: routing on the base map</text></g>
<path stroke="#555" stroke-width="1.5" d="M500 186 V170" fill="none" marker-end="url(#arrow7)"/>
<g><text font-size="12" font-weight="500" fill="#7a7a7a" x="514" y="177" text-anchor="start" dominant-baseline="central">routes and times</text></g>
<path stroke="#555" stroke-width="1.5" d="M170 215 H188" fill="none" marker-end="url(#arrow7)"/>
<path stroke="#555" stroke-width="1.5" d="M830 215 H822" fill="none" marker-end="url(#arrow7)"/>
<g><rect fill="#DDF3F0" stroke="#1F8A7A" x="190" y="262" width="630" height="58" rx="8" stroke-width="0.75"/><text font-size="14" font-weight="700" fill="#0B4F46" x="202" y="277" text-anchor="start" dominant-baseline="central">Where is everyone, and who needs help?</text><text font-size="12" font-weight="700" fill="#0B4F46" x="808" y="277" text-anchor="end" dominant-baseline="central" letter-spacing="1">IMPACT</text><text font-size="12" font-weight="500" fill="#1F6E62" x="202" y="294" text-anchor="start" dominant-baseline="central">People state · shared location, last seen, inferred from home, work, hour · needs or can help</text><text font-size="12" font-weight="500" fill="#1F6E62" x="202" y="309" text-anchor="start" dominant-baseline="central" opacity="0.8">from: check-ins, shared locations, calls, reports · fills: population and movement priors</text></g>
<path stroke="#555" stroke-width="1.5" d="M500 262 V246" fill="none" marker-end="url(#arrow7)"/>
<g><text font-size="12" font-weight="500" fill="#7a7a7a" x="514" y="253" text-anchor="start" dominant-baseline="central">who, where, what they need</text></g>
<path stroke="#555" stroke-width="1.5" d="M170 291 H188" fill="none" marker-end="url(#arrow7)"/>
<path stroke="#555" stroke-width="1.5" d="M830 291 H822" fill="none" marker-end="url(#arrow7)"/>
<g><rect fill="#DDF3F0" stroke="#1F8A7A" x="190" y="338" width="630" height="58" rx="8" stroke-width="0.75"/><text font-size="14" font-weight="700" fill="#0B4F46" x="202" y="353" text-anchor="start" dominant-baseline="central">Is this building, road, or bridge safe?</text><text font-size="12" font-weight="700" fill="#0B4F46" x="808" y="353" text-anchor="end" dominant-baseline="central" letter-spacing="1">IMPACT</text><text font-size="12" font-weight="500" fill="#1F6E62" x="202" y="370" text-anchor="start" dominant-baseline="central">Object state models · force given off vs force it can take · intact, damaged, cut off, unknown</text><text font-size="12" font-weight="500" fill="#1F6E62" x="202" y="385" text-anchor="start" dominant-baseline="central" opacity="0.8">from: photos, reports, sensors on structures · fills: fragility by construction type</text></g>
<path stroke="#555" stroke-width="1.5" d="M500 338 V322" fill="none" marker-end="url(#arrow7)"/>
<g><text font-size="12" font-weight="500" fill="#7a7a7a" x="514" y="329" text-anchor="start" dominant-baseline="central">object states</text></g>
<path stroke="#555" stroke-width="1.5" d="M170 367 H188" fill="none" marker-end="url(#arrow7)"/>
<path stroke="#555" stroke-width="1.5" d="M830 367 H822" fill="none" marker-end="url(#arrow7)"/>
<g><rect fill="#DDF3F0" stroke="#1F8A7A" x="190" y="414" width="630" height="58" rx="8" stroke-width="0.75"/><text font-size="14" font-weight="700" fill="#0B4F46" x="202" y="429" text-anchor="start" dominant-baseline="central">What event is unfolding, and what comes next?</text><text font-size="12" font-weight="700" fill="#0B4F46" x="808" y="429" text-anchor="end" dominant-baseline="central" letter-spacing="1">HAZARD</text><text font-size="12" font-weight="500" fill="#1F6E62" x="202" y="446" text-anchor="start" dominant-baseline="central">Event models, one per hazard · triggers, sequence, cascades, end signals · footprint over time</text><text font-size="12" font-weight="500" fill="#1F6E62" x="202" y="461" text-anchor="start" dominant-baseline="central" opacity="0.8">from: conditions and observations · fills: physics, reduced models, surrogates, event rules</text></g>
<path stroke="#555" stroke-width="1.5" d="M500 414 V398" fill="none" marker-end="url(#arrow7)"/>
<g><text font-size="12" font-weight="500" fill="#7a7a7a" x="514" y="405" text-anchor="start" dominant-baseline="central">the footprint over time</text></g>
<path stroke="#555" stroke-width="1.5" d="M170 443 H188" fill="none" marker-end="url(#arrow7)"/>
<path stroke="#555" stroke-width="1.5" d="M830 443 H822" fill="none" marker-end="url(#arrow7)"/>
<g><rect fill="#DDF3F0" stroke="#1F8A7A" x="190" y="490" width="630" height="58" rx="8" stroke-width="0.75"/><text font-size="14" font-weight="700" fill="#0B4F46" x="202" y="505" text-anchor="start" dominant-baseline="central">What is happening on the ground right now?</text><text font-size="12" font-weight="700" fill="#0B4F46" x="808" y="505" text-anchor="end" dominant-baseline="central" letter-spacing="1">HAZARD</text><text font-size="12" font-weight="500" fill="#1F6E62" x="202" y="522" text-anchor="start" dominant-baseline="central">Condition models · rain, river level, soil moisture, wind, ground motion, fire weather</text><text font-size="12" font-weight="500" fill="#1F6E62" x="202" y="537" text-anchor="start" dominant-baseline="central" opacity="0.8">from: gauges, radar, satellites, phones · fills where no gauge reports: weather, hydrology models</text></g>
<path stroke="#555" stroke-width="1.5" d="M500 490 V474" fill="none" marker-end="url(#arrow7)"/>
<g><text font-size="12" font-weight="500" fill="#7a7a7a" x="514" y="481" text-anchor="start" dominant-baseline="central">conditions, gaps filled</text></g>
<path stroke="#555" stroke-width="1.5" d="M170 519 H188" fill="none" marker-end="url(#arrow7)"/>
<path stroke="#555" stroke-width="1.5" d="M830 519 H822" fill="none" marker-end="url(#arrow7)"/>
<g><rect fill="#F3F3F3" stroke="#8A8A8A" x="190" y="566" width="630" height="58" rx="8" stroke-width="0.75"/><text font-size="14" font-weight="700" fill="#222222" x="202" y="581" text-anchor="start" dominant-baseline="central">What is here?</text><text font-size="12" font-weight="700" fill="#222222" x="808" y="581" text-anchor="end" dominant-baseline="central" letter-spacing="1">BASE</text><text font-size="12" font-weight="500" fill="#555555" x="202" y="598" text-anchor="start" dominant-baseline="central">Base map and object registry · terrain, buildings, roads, bridges, utilities, shelters, people</text><text font-size="12" font-weight="500" fill="#555555" x="202" y="613" text-anchor="start" dominant-baseline="central" opacity="0.8">from: elevation, footprints, roads, census · fills: construction type and occupancy from imagery</text></g>
<path stroke="#555" stroke-width="1.5" d="M500 566 V550" fill="none" marker-end="url(#arrow7)"/>
<g><text font-size="12" font-weight="500" fill="#7a7a7a" x="514" y="557" text-anchor="start" dominant-baseline="central">what is here</text></g>
<path stroke="#555" stroke-width="1.5" d="M170 595 H188" fill="none" marker-end="url(#arrow7)"/>
<path stroke="#555" stroke-width="1.5" d="M830 595 H822" fill="none" marker-end="url(#arrow7)"/>
<g><rect fill="#F3F3F3" stroke="#8A8A8A" x="40" y="110" width="130" height="514" rx="8" stroke-width="0.75"/><text font-size="14" font-weight="700" fill="#222222" x="105" y="239" text-anchor="middle" dominant-baseline="central">Data ingestion</text><text font-size="12" font-weight="500" fill="#555555" x="105" y="256" text-anchor="middle" dominant-baseline="central">manager</text><text font-size="12" font-weight="500" fill="#555555" x="105" y="273" text-anchor="middle" dominant-baseline="central"></text><text font-size="12" font-weight="500" fill="#555555" x="105" y="290" text-anchor="middle" dominant-baseline="central">the data that</text><text font-size="12" font-weight="500" fill="#555555" x="105" y="307" text-anchor="middle" dominant-baseline="central">exists today,</text><text font-size="12" font-weight="500" fill="#555555" x="105" y="324" text-anchor="middle" dominant-baseline="central">by source</text><text font-size="12" font-weight="500" fill="#555555" x="105" y="341" text-anchor="middle" dominant-baseline="central"></text><text font-size="12" font-weight="500" fill="#555555" x="105" y="358" text-anchor="middle" dominant-baseline="central">coverage varies</text><text font-size="12" font-weight="500" fill="#555555" x="105" y="375" text-anchor="middle" dominant-baseline="central">by place and hour</text><text font-size="12" font-weight="500" fill="#555555" x="105" y="392" text-anchor="middle" dominant-baseline="central"></text><text font-size="12" font-weight="500" fill="#555555" x="105" y="409" text-anchor="middle" dominant-baseline="central">connectors,</text><text font-size="12" font-weight="500" fill="#555555" x="105" y="426" text-anchor="middle" dominant-baseline="central">contracts, and a</text><text font-size="12" font-weight="500" fill="#555555" x="105" y="443" text-anchor="middle" dominant-baseline="central">coverage map:</text><text font-size="12" font-weight="500" fill="#555555" x="105" y="460" text-anchor="middle" dominant-baseline="central">what covers where</text><text font-size="12" font-weight="500" fill="#555555" x="105" y="477" text-anchor="middle" dominant-baseline="central"></text><text font-size="12" font-weight="500" fill="#555555" x="105" y="494" text-anchor="middle" dominant-baseline="central">known from →</text></g>
<g><rect fill="#DDF3F0" stroke="#1F8A7A" x="830" y="110" width="130" height="514" rx="8" stroke-width="0.75"/><text font-size="14" font-weight="700" fill="#0B4F46" x="895" y="248" text-anchor="middle" dominant-baseline="central">Model research</text><text font-size="12" font-weight="500" fill="#1F6E62" x="895" y="265" text-anchor="middle" dominant-baseline="central"></text><text font-size="12" font-weight="500" fill="#1F6E62" x="895" y="282" text-anchor="middle" dominant-baseline="central">the models that</text><text font-size="12" font-weight="500" fill="#1F6E62" x="895" y="299" text-anchor="middle" dominant-baseline="central">exist today</text><text font-size="12" font-weight="500" fill="#1F6E62" x="895" y="316" text-anchor="middle" dominant-baseline="central"></text><text font-size="12" font-weight="500" fill="#1F6E62" x="895" y="333" text-anchor="middle" dominant-baseline="central">physics and</text><text font-size="12" font-weight="500" fill="#1F6E62" x="895" y="350" text-anchor="middle" dominant-baseline="central">published models,</text><text font-size="12" font-weight="500" fill="#1F6E62" x="895" y="367" text-anchor="middle" dominant-baseline="central">codes, surrogates</text><text font-size="12" font-weight="500" fill="#1F6E62" x="895" y="384" text-anchor="middle" dominant-baseline="central">event rules</text><text font-size="12" font-weight="500" fill="#1F6E62" x="895" y="401" text-anchor="middle" dominant-baseline="central"></text><text font-size="12" font-weight="500" fill="#1F6E62" x="895" y="418" text-anchor="middle" dominant-baseline="central">which model fills</text><text font-size="12" font-weight="500" fill="#1F6E62" x="895" y="435" text-anchor="middle" dominant-baseline="central">which gap, and</text><text font-size="12" font-weight="500" fill="#1F6E62" x="895" y="452" text-anchor="middle" dominant-baseline="central">how well</text><text font-size="12" font-weight="500" fill="#1F6E62" x="895" y="469" text-anchor="middle" dominant-baseline="central"></text><text font-size="12" font-weight="500" fill="#1F6E62" x="895" y="486" text-anchor="middle" dominant-baseline="central">← filled in by</text></g>
<path stroke="#555" stroke-width="1.5" d="M480 656 V626" fill="none" marker-end="url(#arrow7)"/>
<path stroke="#555" stroke-width="1.5" d="M520 626 V656" fill="none" marker-end="url(#arrow7)"/>
<g><text font-size="12" font-weight="500" fill="#7a7a7a" x="466" y="641" text-anchor="end" dominant-baseline="central">reads</text></g>
<g><text font-size="12" font-weight="500" fill="#7a7a7a" x="534" y="641" text-anchor="start" dominant-baseline="central">writes</text></g>
<g><rect fill="#F3F3F3" stroke="#8A8A8A" x="190" y="658" width="630" height="50" rx="8" stroke-width="0.75"/><text font-size="14" font-weight="700" fill="#222222" x="505" y="676" text-anchor="middle" dominant-baseline="central">Event data aggregator</text><text font-size="12" font-weight="500" fill="#555555" x="505" y="693" text-anchor="middle" dominant-baseline="central">one record per event, every minute: everything known about it, what was seen, what was done</text></g>
<g><text font-size="12" font-weight="700" fill="#121212" x="190" y="722" text-anchor="start" dominant-baseline="central">four views of the same record:</text></g>
<g><rect fill="#DDF3F0" stroke="#1F8A7A" x="190" y="734" width="156" height="64" rx="8" stroke-width="0.75"/><text font-size="14" font-weight="700" fill="#0B4F46" x="268" y="752" text-anchor="middle" dominant-baseline="central">Model builders</text><text font-size="12" font-weight="500" fill="#1F6E62" x="268" y="769" text-anchor="middle" dominant-baseline="central">everything, with</text><text font-size="12" font-weight="500" fill="#1F6E62" x="268" y="784" text-anchor="middle" dominant-baseline="central">the residuals</text></g>
<g><rect fill="#FBE4E0" stroke="#C2502F" x="348" y="734" width="156" height="64" rx="8" stroke-width="0.75"/><text font-size="14" font-weight="700" fill="#6B2412" x="426" y="752" text-anchor="middle" dominant-baseline="central">Emergency managers</text><text font-size="12" font-weight="500" fill="#8A3A20" x="426" y="769" text-anchor="middle" dominant-baseline="central">the operations</text><text font-size="12" font-weight="500" fill="#8A3A20" x="426" y="784" text-anchor="middle" dominant-baseline="central">picture, live</text></g>
<g><rect fill="#E3F3E4" stroke="#2E8B45" x="506" y="734" width="156" height="64" rx="8" stroke-width="0.75"/><text font-size="14" font-weight="700" fill="#14512A" x="584" y="752" text-anchor="middle" dominant-baseline="central">Private, family</text><text font-size="12" font-weight="500" fill="#256E3A" x="584" y="769" text-anchor="middle" dominant-baseline="central">location, shared</text><text font-size="12" font-weight="500" fill="#256E3A" x="584" y="784" text-anchor="middle" dominant-baseline="central">with loved ones</text></g>
<g><rect fill="#FBE4E0" stroke="#C2502F" x="664" y="734" width="156" height="64" rx="8" stroke-width="0.75"/><text font-size="14" font-weight="700" fill="#6B2412" x="742" y="752" text-anchor="middle" dominant-baseline="central">Public event page</text><text font-size="12" font-weight="500" fill="#8A3A20" x="742" y="769" text-anchor="middle" dominant-baseline="central">what is happening,</text><text font-size="12" font-weight="500" fill="#8A3A20" x="742" y="784" text-anchor="middle" dominant-baseline="central">what to do</text></g>
<g><rect fill="#F3F3F3" stroke="#8A8A8A" x="40" y="814" width="930" height="72" rx="8" stroke-width="0.75"/><text font-size="14" font-weight="700" fill="#222222" x="505" y="834" text-anchor="middle" dominant-baseline="central">A how-do-we-know engine.</text><text font-size="12" font-weight="500" fill="#555555" x="505" y="853" text-anchor="middle" dominant-baseline="central">Where the data does not cover a place, a model fills the input. Each rung's answer is the next rung's input.</text><text font-size="12" font-weight="500" fill="#555555" x="505" y="869" text-anchor="middle" dominant-baseline="central">Data source management fills the left rail, model research fills the right. Applied to one place, now, the stack is the world state.</text></g>
</svg>
