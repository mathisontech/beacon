<svg xmlns="http://www.w3.org/2000/svg" width="680" height="500" viewBox="0 0 680 500" role="img" font-family="Manrope, 'Segoe UI', system-ui, sans-serif">
<title>Beacon as a hazard world model</title>
<desc>A general hazard world model (hazard, impact, mitigation, and observation models, learned from history, records, and activity) applied to a place's priors and current signals gives a world state of weighted past, present and future scenarios. The state renders expected signals; perception compares incoming data against them; inference reweights scenarios; planning chooses warning, guidance and mitigation; the actor sends signals back down.</desc>
<rect width="680" height="500" fill="#ffffff"/>
      <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#555" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
      <g><rect fill="#E8F1FB" stroke="#2F6FB3" x="40" y="40" width="600" height="110" rx="20" stroke-width="0.75"/><text font-size="14" font-weight="700" fill="#0C447C" x="60" y="60" dominant-baseline="central">Hazard world model</text><text font-size="12" font-weight="500" fill="#0C447C" x="620" y="60" text-anchor="end" dominant-baseline="central">general · owns every model · knows no one person</text></g>
      <g><rect fill="#DDF3F0" stroke="#1F8A7A" x="60" y="76" width="136" height="54" rx="8" stroke-width="0.75"/><text font-size="14" font-weight="700" fill="#0B4F46" x="128" y="94" text-anchor="middle" dominant-baseline="central">Hazard models</text><text font-size="12" font-weight="500" fill="#1F6E62" x="128" y="114" text-anchor="middle" dominant-baseline="central">triggers, cascades</text></g>
      <g><rect fill="#DDF3F0" stroke="#1F8A7A" x="204" y="76" width="136" height="54" rx="8" stroke-width="0.75"/><text font-size="14" font-weight="700" fill="#0B4F46" x="272" y="94" text-anchor="middle" dominant-baseline="central">Impact models</text><text font-size="12" font-weight="500" fill="#1F6E62" x="272" y="114" text-anchor="middle" dominant-baseline="central">force out, force taken</text></g>
      <g><rect fill="#DDF3F0" stroke="#1F8A7A" x="348" y="76" width="136" height="54" rx="8" stroke-width="0.75"/><text font-size="14" font-weight="700" fill="#0B4F46" x="416" y="94" text-anchor="middle" dominant-baseline="central">Mitigation models</text><text font-size="12" font-weight="500" fill="#1F6E62" x="416" y="114" text-anchor="middle" dominant-baseline="central">what changes it</text></g>
      <g><rect fill="#DDF3F0" stroke="#1F8A7A" x="492" y="76" width="136" height="54" rx="8" stroke-width="0.75"/><text font-size="14" font-weight="700" fill="#0B4F46" x="560" y="94" text-anchor="middle" dominant-baseline="central">Observation model</text><text font-size="12" font-weight="500" fill="#1F6E62" x="560" y="114" text-anchor="middle" dominant-baseline="central">what a sensor sees</text></g>
      <line stroke="#555" stroke-width="1.5" x1="350" y1="150" x2="350" y2="188" marker-end="url(#arrow)"/>
      <g><rect fill="#EEE8FA" stroke="#6C4BB8" x="230" y="190" width="240" height="56" rx="8" stroke-width="0.75"/><text font-size="14" font-weight="700" fill="#3A2478" x="350" y="208" text-anchor="middle" dominant-baseline="central">World state</text><text font-size="12" font-weight="500" fill="#5B3FA0" x="350" y="226" text-anchor="middle" dominant-baseline="central">this place, now: past, present, future</text></g>
      <g><rect fill="#EEE8FA" stroke="#6C4BB8" x="490" y="190" width="150" height="56" rx="8" stroke-width="0.75"/><text font-size="14" font-weight="700" fill="#3A2478" x="565" y="208" text-anchor="middle" dominant-baseline="central">Place priors</text><text font-size="12" font-weight="500" fill="#5B3FA0" x="565" y="226" text-anchor="middle" dominant-baseline="central">terrain, people, routes</text></g>
      <line stroke="#555" stroke-width="1.5" x1="490" y1="218" x2="472" y2="218" marker-end="url(#arrow)"/>
      <g><rect fill="#FBF0D6" stroke="#B7791F" x="40" y="190" width="160" height="56" rx="8" stroke-width="0.75"/><text font-size="14" font-weight="700" fill="#6B4308" x="120" y="208" text-anchor="middle" dominant-baseline="central">Expected signals</text><text font-size="12" font-weight="500" fill="#8C5A12" x="120" y="226" text-anchor="middle" dominant-baseline="central">by place, time, sensor</text></g>
      <line stroke="#555" stroke-width="1.5" x1="230" y1="218" x2="202" y2="218" marker-end="url(#arrow)"/>
      <line stroke="#555" stroke-width="1.5" x1="120" y1="246" x2="120" y2="298" marker-end="url(#arrow)"/>
      <line stroke="#555" stroke-width="1.5" x1="259" y1="300" x2="259" y2="248" marker-end="url(#arrow)"/>
      <line stroke="#555" stroke-width="1.5" x1="417" y1="246" x2="417" y2="298" marker-end="url(#arrow)"/>
      <g><rect fill="#E3F3E4" stroke="#2E8B45" x="40" y="300" width="122" height="56" rx="8" stroke-width="0.75"/><text font-size="14" font-weight="700" fill="#14512A" x="101" y="318" text-anchor="middle" dominant-baseline="central">Perception</text><text font-size="12" font-weight="500" fill="#256E3A" x="101" y="336" text-anchor="middle" dominant-baseline="central">expected vs seen</text></g>
      <g><rect fill="#E3F3E4" stroke="#2E8B45" x="198" y="300" width="122" height="56" rx="8" stroke-width="0.75"/><text font-size="14" font-weight="700" fill="#14512A" x="259" y="318" text-anchor="middle" dominant-baseline="central">Inference</text><text font-size="12" font-weight="500" fill="#256E3A" x="259" y="336" text-anchor="middle" dominant-baseline="central">reweight scenarios</text></g>
      <g><rect fill="#E3F3E4" stroke="#2E8B45" x="356" y="300" width="122" height="56" rx="8" stroke-width="0.75"/><text font-size="14" font-weight="700" fill="#14512A" x="417" y="318" text-anchor="middle" dominant-baseline="central">Planning</text><text font-size="12" font-weight="500" fill="#256E3A" x="417" y="336" text-anchor="middle" dominant-baseline="central">options and plan</text></g>
      <g><rect fill="#E3F3E4" stroke="#2E8B45" x="514" y="300" width="122" height="56" rx="8" stroke-width="0.75"/><text font-size="14" font-weight="700" fill="#14512A" x="575" y="318" text-anchor="middle" dominant-baseline="central">Actor</text><text font-size="12" font-weight="500" fill="#256E3A" x="575" y="336" text-anchor="middle" dominant-baseline="central">alerts and tasking</text></g>
      <line stroke="#555" stroke-width="1.5" x1="162" y1="328" x2="196" y2="328" marker-end="url(#arrow)"/>
      <line stroke="#555" stroke-width="1.5" x1="320" y1="328" x2="354" y2="328" marker-end="url(#arrow)"/>
      <line stroke="#555" stroke-width="1.5" x1="478" y1="328" x2="512" y2="328" marker-end="url(#arrow)"/>
      <line stroke="#555" stroke-width="1.5" x1="101" y1="420" x2="101" y2="358" marker-end="url(#arrow)"/>
      <line stroke="#555" stroke-width="1.5" x1="575" y1="356" x2="575" y2="418" marker-end="url(#arrow)"/>
      <g><rect fill="#F3F3F3" stroke="#8A8A8A" x="40" y="420" width="260" height="56" rx="8" stroke-width="0.75"/><text font-size="14" font-weight="700" fill="#222222" x="170" y="438" text-anchor="middle" dominant-baseline="central">Sources and products</text><text font-size="12" font-weight="500" fill="#555555" x="170" y="456" text-anchor="middle" dominant-baseline="central">satellites, gauges, phones, our apps</text></g>
      <g><rect fill="#F3F3F3" stroke="#8A8A8A" x="380" y="420" width="256" height="56" rx="8" stroke-width="0.75"/><text font-size="14" font-weight="700" fill="#222222" x="508" y="438" text-anchor="middle" dominant-baseline="central">Signals back down</text><text font-size="12" font-weight="500" fill="#555555" x="508" y="456" text-anchor="middle" dominant-baseline="central">phones, agencies, responders</text></g>
</svg>
