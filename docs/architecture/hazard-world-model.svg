<svg xmlns="http://www.w3.org/2000/svg" width="680" height="500" viewBox="0 0 680 500" role="img" font-family="Manrope, 'Segoe UI', system-ui, sans-serif">
<title>Beacon as a hazard world model</title>
<desc>A hazard world model (dynamics, observation model, priors) maintains a world state of weighted past, present and future scenarios. The state renders expected signals by place, time and sensor. Perception compares incoming data against them; inference reweights scenarios; planning chooses warning, guidance and mitigation; the actor sends signals back down. Data from all sources and Beacon's own products flows in.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#555" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="500" fill="#ffffff"/>
<g><rect x="40" y="40" width="600" height="110" rx="20" fill="#E8F1FB" stroke="#2F6FB3" stroke-width="0.75"/><text x="60" y="60" dominant-baseline="central" font-size="14" font-weight="700" fill="#0C447C">Hazard world model</text></g>
<g><rect x="60" y="76" width="170" height="54" rx="8" fill="#DDF3F0" stroke="#1F8A7A" stroke-width="0.75"/><text x="145" y="94" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="700" fill="#0B4F46">Hazard dynamics</text><text x="145" y="114" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#1F6E62">physics, human behavior</text></g>
<g><rect x="246" y="76" width="170" height="54" rx="8" fill="#DDF3F0" stroke="#1F8A7A" stroke-width="0.75"/><text x="331" y="94" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="700" fill="#0B4F46">Observation model</text><text x="331" y="114" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#1F6E62">what a sensor would see</text></g>
<g><rect x="432" y="76" width="170" height="54" rx="8" fill="#DDF3F0" stroke="#1F8A7A" stroke-width="0.75"/><text x="517" y="94" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="700" fill="#0B4F46">World priors</text><text x="517" y="114" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#1F6E62">terrain, people, routes</text></g>
<line x1="350" y1="150" x2="350" y2="188" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
<g><rect x="230" y="190" width="240" height="56" rx="8" fill="#EEE8FA" stroke="#6C4BB8" stroke-width="0.75"/><text x="350" y="208" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="700" fill="#3A2478">World state</text><text x="350" y="226" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5B3FA0">past, present, future scenarios</text></g>
<g><rect x="40" y="190" width="160" height="56" rx="8" fill="#FBF0D6" stroke="#B7791F" stroke-width="0.75"/><text x="120" y="208" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="700" fill="#6B4308">Expected signals</text><text x="120" y="226" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#8C5A12">by place, time, sensor</text></g>
<line x1="230" y1="218" x2="202" y2="218" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="120" y1="246" x2="120" y2="298" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="259" y1="300" x2="259" y2="248" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="417" y1="246" x2="417" y2="298" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
<g><rect x="40" y="300" width="122" height="56" rx="8" fill="#E3F3E4" stroke="#2E8B45" stroke-width="0.75"/><text x="101" y="318" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="700" fill="#14512A">Perception</text><text x="101" y="336" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#256E3A">expected vs seen</text></g>
<g><rect x="198" y="300" width="122" height="56" rx="8" fill="#E3F3E4" stroke="#2E8B45" stroke-width="0.75"/><text x="259" y="318" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="700" fill="#14512A">Inference</text><text x="259" y="336" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#256E3A">reweight scenarios</text></g>
<g><rect x="356" y="300" width="122" height="56" rx="8" fill="#E3F3E4" stroke="#2E8B45" stroke-width="0.75"/><text x="417" y="318" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="700" fill="#14512A">Planning</text><text x="417" y="336" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#256E3A">options and plan</text></g>
<g><rect x="514" y="300" width="122" height="56" rx="8" fill="#E3F3E4" stroke="#2E8B45" stroke-width="0.75"/><text x="575" y="318" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="700" fill="#14512A">Actor</text><text x="575" y="336" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#256E3A">alerts and tasking</text></g>
<line x1="162" y1="328" x2="196" y2="328" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="320" y1="328" x2="354" y2="328" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="478" y1="328" x2="512" y2="328" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="101" y1="420" x2="101" y2="358" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="575" y1="356" x2="575" y2="418" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
<g><rect x="40" y="420" width="260" height="56" rx="8" fill="#F3F3F3" stroke="#8A8A8A" stroke-width="0.75"/><text x="170" y="438" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="700" fill="#222">Sources and products</text><text x="170" y="456" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#555">satellites, gauges, phones, our apps</text></g>
<g><rect x="380" y="420" width="256" height="56" rx="8" fill="#F3F3F3" stroke="#8A8A8A" stroke-width="0.75"/><text x="508" y="438" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="700" fill="#222">Signals back down</text><text x="508" y="456" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#555">phones, agencies, responders</text></g>
</svg>
