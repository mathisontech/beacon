<!DOCTYPE html>
<html>
<head><style>
  body { font-family: sans-serif; background: #1f3348; display: flex; gap: 40px; padding: 40px; align-items: flex-start; flex-wrap: wrap; }
  .option { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .label { color: rgba(255,255,255,0.5); font-size: 11px; text-transform: uppercase; letter-spacing: 1px; max-width: 120px; text-align: center; }
  .name { color: rgba(255,255,255,0.85); font-size: 13px; font-weight: 600; }
  svg { background: rgba(255,255,255,0.05); border-radius: 8px; padding: 12px; }
</style></head>
<body>

<div class="option">
  <div class="name">A: Megaphone</div>
  <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="m3 11 18-5v12L3 13v-2z" />
    <path d="M11.6 16.8a3 3 0 1 1-5.8-1.6" />
  </svg>
  <div class="label">Community voice / shout out</div>
</div>

<div class="option">
  <div class="name">B: Speech Bubble</div>
  <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
    <path d="M12 8v.01" />
    <path d="M8 11h8" />
    <path d="M8 8h3" />
  </svg>
  <div class="label">User message / report</div>
</div>

<div class="option">
  <div class="name">C: Eye (witness)</div>
  <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
    <circle cx="12" cy="12" r="3" />
  </svg>
  <div class="label">Eyewitness / sighting</div>
</div>

<div class="option">
  <div class="name">D: Pencil + Note</div>
  <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 20h9" />
    <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z" />
  </svg>
  <div class="label">Write / submit report</div>
</div>

<div class="option">
  <div class="name">E: Pin + Exclamation</div>
  <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z" />
    <line x1="12" y1="8" x2="12" y2="12" />
    <line x1="12" y1="15" x2="12.01" y2="15" />
  </svg>
  <div class="label">Location-based report / flag</div>
</div>

<div class="option">
  <div class="name">F: Person + Speech</div>
  <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="8" cy="7" r="3" />
    <path d="M8 14a5 5 0 0 0-5 5v2h10v-2a5 5 0 0 0-5-5z" />
    <path d="M17 6h4" />
    <path d="M19 4v4" />
  </svg>
  <div class="label">User contributing info</div>
</div>

</body>
</html>
