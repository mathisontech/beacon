  .ceo .name-slot { font-size: 15px; font-weight: 600; }

  .ring-core .ring-label { background: #0e7490; color: white; }
  .ring-org .ring-label { background: #6b7280; color: white; }

  /* Department cards */
  .dept-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; }

  .dept {
    background: white;
    border-radius: 10px;
    border: 1px solid #e5e7eb;
    overflow: hidden;
    transition: box-shadow 0.15s;
  }
  .dept:hover { box-shadow: 0 2px 12px rgba(0,0,0,0.06); }

  .dept-header {
    padding: 14px 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 10px;
    user-select: none;
  }
  .dept-header:hover { background: #fafafa; }

  .dept-color { width: 4px; height: 36px; border-radius: 2px; flex-shrink: 0; }
  .dept-info { flex: 1; }
  .dept-title { font-size: 13px; font-weight: 700; color: #111; }
  .dept-role { font-size: 11px; color: #888; margin-top: 1px; }
  .dept-chevron { font-size: 14px; color: #bbb; transition: transform 0.2s; }
  .dept.open .dept-chevron { transform: rotate(90deg); }

  .dept-body { display: none; padding: 0 16px 14px; }
  .dept.open .dept-body { display: block; }

  .vp { margin-bottom: 10px; }
  .vp-header {
    font-size: 12px;
    font-weight: 600;
    color: #374151;
    padding: 6px 0 4px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    user-select: none;
  }
  .vp-header:hover { color: #111; }
  .vp-chevron { font-size: 10px; color: #bbb; transition: transform 0.15s; }
  .vp.open .vp-chevron { transform: rotate(90deg); }

  .vp-teams { display: none; padding-left: 14px; border-left: 2px solid #f0f0f0; margin-left: 2px; }
  .vp.open .vp-teams { display: block; }

  .team { font-size: 11.5px; color: #555; padding: 3px 0; line-height: 1.4; }
  .team-head { color: #111; font-weight: 500; }
  .headcount { font-size: 10px; color: #aaa; margin-left: 4px; }

  .c-data { background: #7c3aed; }

        title: "Risk & Liability",
        teams: [
          { name: "Emergency Liability & Indemnification", head: "Lead", hc: "2-3" },
          { name: "IP & Patents", head: "Lead", hc: "2-3" },
          { name: "Insurance & Claims", head: "Lead", hc: "1-2" },
        ]
      }
    ]
  },
];

function renderGrid(gridId, depts) {
  const grid = document.getElementById(gridId);
  let tMin = 0, tMax = 0;
  depts.forEach(dept => {
    const el = document.createElement("div");
    el.className = "dept";
    el.innerHTML = `
      <div class="dept-header" onclick="this.parentElement.classList.toggle('open')">
        <div class="dept-color ${dept.color}"></div>
        <div class="dept-info">
          <div class="dept-title">${dept.abbr} — ${dept.title}</div>
          <div class="dept-role">${dept.vps.length} division${dept.vps.length > 1 ? 's' : ''}</div>
        </div>
        <div class="dept-chevron">&#9654;</div>
      </div>
      <div class="dept-body">
        ${dept.vps.map(vp => `<div class="vp">
          <div class="vp-header" onclick="event.stopPropagation(); this.parentElement.classList.toggle('open')">
            <span class="vp-chevron">&#9654;</span>
            ${vp.title} <span class="headcount">(${vp.teams.length} teams)</span>
          </div>
          <div class="vp-teams">
            ${vp.teams.map(t => {
              const [lo, hi] = t.hc.split("-").map(Number);
              tMin += lo; tMax += hi;
              return `<div class="team"><span class="team-head">${t.name}</span> <span class="headcount">${t.head} &middot; ${t.hc}</span></div>`;
            }).join("")}
          </div>
        </div>`).join("")}
      </div>
    `;
    grid.appendChild(el);
  });
  return { min: tMin, max: tMax, count: depts.length };
}

const c = renderGrid("coreGrid", core);
const o = renderGrid("orgGrid", orgMgmt);
document.getElementById("totalCount").textContent = `${c.min + o.min}\u2013${c.max + o.max}`;
document.getElementById("deptCount").textContent = `${c.count + o.count}`;
</script>
</body>
